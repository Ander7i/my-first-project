[tool.ruff]
line-length = 100
# Код должен работать на Python 3.10: на Ubuntu 22.04, самом частом образе
# дешёвых VPS, стоит именно он. Выше поднимать — значит заставлять людей
# собирать Python руками на сервере.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ISC", "RUF"]
ignore = [
    # Предлагает datetime.UTC вместо timezone.utc, а это Python 3.11.
    "UP017",
    # Правило ищет латиницу, замаскированную под кириллицу. Проект
    # русскоязычный, поэтому срабатывает на каждом слове.
    "RUF001",
    "RUF002",
    "RUF003",
]
