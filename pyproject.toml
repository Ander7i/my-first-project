[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ISC", "RUF"]
ignore = [
    # Широкий except в обработчиках осознанный: падение одной отправки
    # не должно останавливать рассылку или polling.
    "BLE001",
    # Правило ищет латиницу, замаскированную под кириллицу. Проект
    # русскоязычный, поэтому срабатывает на каждом слове.
    "RUF001",
    "RUF002",
    "RUF003",
]
